[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# ONNX inference
ort = "2.0.0-rc.13"
ndarray = "0.17"

# Tokenization
tokenizers = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Configuration
envy = "0.4"

# Instrumentation (prep for Phase 2)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics (Phase 2 observability)
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# OpenTelemetry (conditional at runtime, Phase 2)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"

# gRPC serving (Phase 10)
tonic = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"

# HTTP serving (Phase 2)
axum = { version = "0.8", features = ["http2", "ws"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.7", features = ["limit", "timeout", "trace"] }

# Model acquisition (Phase 3)
reqwest = { version = "0.13", features = ["json"] }

# Storage abstraction (Phase 6)
opendal = { version = "0.58", features = ["services-s3", "services-fs", "services-gcs"] }

# Audio feature extraction
mel_spec = "0.4"

# Dev/test dependencies
hf-hub = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
mockall = "0.15"
tempfile = "3"


[profile.release]
opt-level = 3          # Maximum optimization
lto = "fat"            # Full link-time optimization
codegen-units = 1      # Better optimization, slower compile
panic = "abort"        # Smaller binary, no unwinding
strip = true           # Remove symbols
